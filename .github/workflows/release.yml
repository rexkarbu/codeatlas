name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Environment
        run: flutter --version

      - name: Install dependencies
        working-directory: codeatlas
        run: flutter pub get

      - name: Run code analysis & tests
        working-directory: codeatlas
        run: |
          flutter analyze
          flutter test test -j 1

      - name: Build Release APK
        working-directory: codeatlas
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp codeatlas/build/app/outputs/flutter-apk/app-release.apk release-output/CodeAtlas.apk

      - name: Determine Tag Name
        id: vars
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: CodeAtlas ${{ steps.vars.outputs.tag }}
          body: |
            ## Pembaruan CodeAtlas ${{ steps.vars.outputs.tag }}

            ### ✨ Sorotan Rilis:
            - **Identitas Visual & Ikon Baru**: Ikon aplikasi resmi bertema Deep Tech Synth—memadukan kisi kartografi/atlas pengetahuan dan kurung kode (`< / >`). Dilengkapi dukungan Android adaptive icon, round icon, dan themed monochrome icon.
            - **Audit & Keterbacaan Materi (Content v5)**: Seluruh 99 topik diaudit dengan penjelasan ringkas, akurat, dan langsung pada inti fungsi.
            - **Revisi Menyeluruh Programming Logic**: Penjelasan terstruktur 8 bagian pedagogis tanpa jargon hardware CPU/register.
            - **Peningkatan Keterbacaan Artikel**: Navigasi Daftar Isi dipindahkan ke AppBar, teks isi menggunakan bobot normal (*regular*), dan penghapusan FAB.
            - **Penyederhanaan Perbandingan Sintaks**: Tombol pemilih konsep tunggal membuka modal bottom sheet dengan label Bahasa Indonesia, kartu vertikal responsif, dan bebas overflow pada skala teks 200%.
            - **52 Pengujian Lulus (100% Pass)**: Integritas kurikulum, graf ketergantungan asiklik (Kahn), migrasi basis data SQLite, dan ketahanan UI terverifikasi penuh.

            ### 📦 Berkas Instalasi:
            Unduh berkas `CodeAtlas.apk` di bawah dan pasang pada perangkat Android Anda.
          files: |
            release-output/CodeAtlas.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
