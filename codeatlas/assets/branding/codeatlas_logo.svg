<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Space Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#14113B"/>
      <stop offset="100%" stop-color="#0C0A27"/>
    </linearGradient>

    <!-- Bracket Gradients: Electric Violet & Hyper Cyan -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cyanSky" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Squircle / Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer edge highlight -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Radial ambient glow behind central hub -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)"/>

  <!-- 2. Clean Central Meridian Axis (High contrast, non-cluttered) -->
  <line x1="256" y1="110" x2="256" y2="402" 
        stroke="#8B5CF6" 
        stroke-opacity="0.35" 
        stroke-width="8" 
        stroke-linecap="round"/>

  <!-- 3. Primary Geometry: Code Syntax Brackets '<' and '>' (Bold 32px stroke) -->
  <!-- Left Code Bracket '<' (Knowledge Vector) -->
  <path d="M 236 156 L 140 256 L 236 356" 
        fill="none" 
        stroke="url(#violetCyan)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Right Code Bracket '>' (Navigation Vector) -->
  <path d="M 276 156 L 372 256 L 276 356" 
        fill="none" 
        stroke="url(#cyanSky)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- 4. Constellation Nodes on Apexes -->
  <circle cx="140" cy="256" r="16" fill="#A78BFA" stroke="#1E1B4B" stroke-width="5"/>
  <circle cx="372" cy="256" r="16" fill="#38BDF8" stroke="#1E1B4B" stroke-width="5"/>

  <!-- 5. Central Atlas Hub Core (Clear visual anchor across all scales) -->
  <circle cx="256" cy="256" r="26" fill="#0F0D2E" stroke="#22D3EE" stroke-width="8"/>
  <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
</svg>
