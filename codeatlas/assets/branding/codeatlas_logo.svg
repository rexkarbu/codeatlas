<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Space Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#15123F"/>
      <stop offset="100%" stop-color="#0C0A27"/>
    </linearGradient>

    <!-- Bracket Gradients: Electric Violet & Hyper Cyan -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cyanSky" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Glow -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle / Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle specular edge highlight -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Radial glow behind central hub -->
  <circle cx="256" cy="256" r="176" fill="url(#centerGlow)"/>

  <!-- 2. Cartographic Coordinate Grid & Astrolabe Latitude Circles (Subtle) -->
  <g stroke="#8B5CF6" stroke-opacity="0.14" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="168" stroke-dasharray="4 6"/>
    <circle cx="256" cy="256" r="108"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="3 5"/>
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="3 5"/>
  </g>

  <!-- 3. Primary Geometry: Code Syntax Brackets '<' and '>' -->
  <!-- Left Code Bracket '<' (Knowledge Vector) -->
  <path d="M 230 148 L 140 256 L 230 364" 
        fill="none" 
        stroke="url(#violetCyan)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#vectorGlow)"/>

  <!-- Right Code Bracket '>' (Navigation Vector) -->
  <path d="M 282 148 L 372 256 L 282 364" 
        fill="none" 
        stroke="url(#cyanSky)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#vectorGlow)"/>

  <!-- 4. Central Meridian / Siku Alur Komputasi -->
  <line x1="256" y1="136" x2="256" y2="376" 
        stroke="#C4B5FD" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-dasharray="1 20"/>

  <!-- 5. Constellation Knowledge Nodes on Apexes -->
  <circle cx="140" cy="256" r="14" fill="#A78BFA" stroke="#1E1B4B" stroke-width="4"/>
  <circle cx="372" cy="256" r="14" fill="#38BDF8" stroke="#1E1B4B" stroke-width="4"/>

  <circle cx="230" cy="148" r="12" fill="#C4B5FD" stroke="#1E1B4B" stroke-width="4"/>
  <circle cx="230" cy="364" r="12" fill="#8B5CF6" stroke="#1E1B4B" stroke-width="4"/>

  <circle cx="282" cy="148" r="12" fill="#38BDF8" stroke="#1E1B4B" stroke-width="4"/>
  <circle cx="282" cy="364" r="12" fill="#06B6D4" stroke="#1E1B4B" stroke-width="4"/>

  <!-- 6. Central Atlas Core Nucleus -->
  <circle cx="256" cy="256" r="22" fill="#0F0D2E" stroke="#22D3EE" stroke-width="8"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

  <!-- 7. Compass Cardinal Indicators (North & South orientation marks) -->
  <polygon points="256,92 263,108 256,120 249,108" fill="#38BDF8"/>
  <polygon points="256,420 263,404 256,392 249,404" fill="#8B5CF6"/>
</svg>
